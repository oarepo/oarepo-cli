[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oarepo-cli"
version = "14.3.0"
description = "A standalone Python CLI for OARepo library and repository management"
readme = "README.md"
license = "MIT"
dependencies = [
    # Requires the CESNET-patched build (see [tool.uv.sources] below); the
    # installed version is verified at startup in oarepo_cli.core.dependency_check
    "invenio-cli>=1.12.0,<2.0.0",
    "packaging>=24.0",
    "typer>=0.12.0",
    # Linters/type checkers run by `library lint`/`library format` against
    # the target project. Bundled as regular dependencies (rather than
    # invoked via `uvx`) so they run without a per-call resolve/download.
    "ruff>=0.9.0",
    "ty>=0.0.65",
    # .gitignore pattern parsing for lint's gitignore-aware file discovery
    # (oarepo_cli.services.lint)
    "pathspec>=0.12.0",
    # Tools for library commands
    "oarepo-tools",  # make-translations command
    # Model manager (services/models.py): run copier in-process from this
    # venv rather than shelling out to `uvx copier`. copier-template-extensions
    # (note: singular -- copier-templates-extensions is the deprecated old
    # name) provides the `copier_templates_extensions` jinja extension the
    # nrp-app-copier/nrp-model-copier templates load; pycountry/tomli/tomli-w
    # are needed by those templates' own extensions and post-generation
    # tasks (e.g. registering a new model in pyproject.toml/invenio.cfg),
    # which run with copier's own interpreter -- i.e. this venv's.
    "copier>=9.0.0",
    "copier-template-extensions>=0.3.0",
    "pycountry>=24.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    # Local package manager (services/local_packages.py): edits a target
    # project's own pyproject.toml ([project].dependencies,
    # [tool.uv.sources]) in place. Unlike tomllib (read-only) or tomli-w
    # (write-only, full-dict dump), tomlkit is round-trip-preserving --
    # comments, key order, and formatting elsewhere in the file survive.
    "tomlkit>=0.13.0",
    # Docker services management (services/services_lifecycle.py). Pulled
    # from the rustfs branch of a fork (see [tool.uv.sources] below) until
    # RustFS support lands upstream; the [s3] extra pulls in boto3, needed
    # by that branch's healthcheck to create RustFS's default bucket (unlike
    # MinIO, RustFS doesn't auto-create it from the data volume at startup).
    # Projects depending on oarepo-cli can't inherit that git pin, so
    # _site_bootstrap/oarepo_cli_rustfs_bootstrap.pth installs the fork into
    # their environment at interpreter startup until this is released.
    "docker-services-cli[s3]>=0.12.0,<1.0.0",
]
requires-python = ">=3.14,<3.15"

[project.urls]
Homepage = "https://github.com/oarepo/oarepo-cli"

[project.scripts]
oarepo-cli = "oarepo_cli.cli.main:cli_main"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]
tests = [
    "pytest>=7.1.2",
    "pytest-cov>=4.0.0",
    "pytest-subprocess>=1.5.0",
    "pytest-mock>=3.14.0",
]
oarepo14 = [
    # Never installed (no run.sh/CI target requests this extra) -- exists
    # solely so PyProjectData.oarepo_versions (see pyproject_reader.py) can
    # detect "14" for `oarepo-cli library oarepo-versions`, which drives the
    # CI test matrix in run.sh/.github/workflows.
    "oarepo>=14.0.0,<15.0.0",
]

# CESNET GitLab PyPI registry, used to resolve the CESNET-patched
# invenio-cli build (with docker-environment and other OARepo patches).
[[tool.uv.index]]
name = "cesnet"
url = "https://gitlab.cesnet.cz/api/v4/projects/1408/packages/pypi/simple"

[tool.uv.sources]
invenio-cli = { index = "cesnet" }
# Not yet released upstream/on the cesnet index -- switch back to a normal
# version constraint once RustFS support lands in a real docker-services-cli
# release.
#
# WARNING: uv only applies [tool.uv.sources] for the *root* project of a
# resolution, so this pin covers oarepo-cli's own environment but NOT projects
# that merely depend on oarepo-cli (they resolve docker-services-cli from PyPI).
# _site_bootstrap/oarepo_cli_rustfs_bootstrap.pth repairs those environments at
# interpreter startup; see that module's docstring. Remove both together with
# this entry once RustFS support is released.
docker-services-cli = { git = "https://github.com/mesemus/docker-services-cli", branch = "rustfs" }

[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_cli",
    "/oarepo_cli_rustfs_bootstrap.pth",
]

# The docker-services-cli bootstrap hook (see oarepo_cli/_docker_services_cli_patch.py).
# Both files are installed at site-packages *root*: `site` only executes .pth
# files found in a site directory, and the hook must be importable before any
# dependency is, so it cannot live inside the oarepo_cli package at runtime.
# The module itself is kept inside the package in the source tree so that linting,
# tests and the license-header check treat it like any other source file.
[tool.hatch.build.targets.wheel.force-include]
"oarepo_cli_rustfs_bootstrap.pth" = "oarepo_cli_rustfs_bootstrap.pth"
"oarepo_cli/_docker_services_cli_patch.py" = "_oarepo_cli_docker_services_cli_patch.py"

# Ruff configuration
[tool.ruff]
target-version = "py313"  # Python 3.14 as specified in requires-python
line-length = 100
src = ["oarepo_cli", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501", # line-too-long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["oarepo_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Ty (type checker for Python 3.14+)
# Use --python-version 3.14 when running ty check

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=oarepo_cli",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "characterization: marks tests as characterization tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["oarepo_cli"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    # Scripts executed as text inside the *target project's* venv (via
    # `invenio shell` / `python`), never imported by this in-process suite,
    # so coverage.py here can never see them run.
    "*/configuration/check_migrations.py",
    "*/configuration/webpack_entries.py",
    "*/configuration/rdm_dev_deps.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
