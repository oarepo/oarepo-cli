[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oarepo-cli"
version = "14.0.0"
description = "A standalone Python CLI for OARepo library and repository management"
readme = "README.md"
license = "MIT"
dependencies = [
    # Requires the CESNET-patched build (see [tool.uv.sources] below); the
    # installed version is verified at startup in oarepo_cli.core.dependency_check
    "invenio-cli>=1.12.0,<2.0.0",
    "packaging>=24.0",
    "typer>=0.12.0",
    # Linters/type checkers run by `library lint`/`library format` against
    # the target project. Bundled as regular dependencies (rather than
    # invoked via `uvx`) so they run without a per-call resolve/download.
    "ruff>=0.9.0",
    "ty>=0.0.65",
    # .gitignore pattern parsing for lint's gitignore-aware file discovery
    # (oarepo_cli.services.lint)
    "pathspec>=0.12.0",
    # Tools for library commands
    "oarepo-tools",  # make-translations command
    # Model manager (services/models.py): run copier in-process from this
    # venv rather than shelling out to `uvx copier`. copier-template-extensions
    # (note: singular -- copier-templates-extensions is the deprecated old
    # name) provides the `copier_templates_extensions` jinja extension the
    # nrp-app-copier/nrp-model-copier templates load; pycountry/tomli/tomli-w
    # are needed by those templates' own extensions and post-generation
    # tasks (e.g. registering a new model in pyproject.toml/invenio.cfg),
    # which run with copier's own interpreter -- i.e. this venv's.
    "copier>=9.0.0",
    "copier-template-extensions>=0.3.0",
    "pycountry>=24.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    # Local package manager (services/local_packages.py): edits a target
    # project's own pyproject.toml ([project].dependencies,
    # [tool.uv.sources]) in place. Unlike tomllib (read-only) or tomli-w
    # (write-only, full-dict dump), tomlkit is round-trip-preserving --
    # comments, key order, and formatting elsewhere in the file survive.
    "tomlkit>=0.13.0",
    # Docker services management (services/services_lifecycle.py)
    "docker-services-cli>=0.12.0,<1.0.0",
]
requires-python = ">=3.14,<3.15"

[project.urls]
Homepage = "https://github.com/oarepo/oarepo-cli"

[project.scripts]
oarepo-cli = "oarepo_cli.cli.main:cli_main"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]
tests = [
    "pytest>=7.1.2",
    "pytest-cov>=4.0.0",
    "pytest-subprocess>=1.5.0",
    "pytest-mock>=3.14.0",
]
oarepo14 = [
    # Never installed (no run.sh/CI target requests this extra) -- exists
    # solely so PyProjectData.oarepo_versions (see pyproject_reader.py) can
    # detect "14" for `oarepo-cli library oarepo-versions`, which drives the
    # CI test matrix in run.sh/.github/workflows.
    "oarepo>=14.0.0,<15.0.0",
]

# CESNET GitLab PyPI registry, used to resolve the CESNET-patched
# invenio-cli build (with docker-environment and other OARepo patches).
[[tool.uv.index]]
name = "cesnet"
url = "https://gitlab.cesnet.cz/api/v4/projects/1408/packages/pypi/simple"

[tool.uv.sources]
invenio-cli = { index = "cesnet" }

[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_cli",
]

# Ruff configuration
[tool.ruff]
target-version = "py313"  # Python 3.14 as specified in requires-python
line-length = 100
src = ["oarepo_cli", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501", # line-too-long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["oarepo_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Ty (type checker for Python 3.14+)
# Use --python-version 3.14 when running ty check

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=oarepo_cli",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "characterization: marks tests as characterization tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["oarepo_cli"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
